<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anima Rx</title><meta name="description" content="Type a drug name or code and see where it goes in the body and what it does at its target.">
<style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
*{box-sizing:border-box}
body{margin:0}
.iso{color-scheme:dark;min-height:100%;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.iso[data-theme="light"]{color-scheme:light}
.iso{--rx-drug:var(--anatomy-lit);--rx-sig:var(--anatomy-green);--rx-bad:var(--anatomy-red);--rx-rna:var(--anatomy-blue)}
.iso{--rx-need:#f0b43c;--rx-need-bg:#f0b43c1f}
.iso[data-theme="light"]{--rx-need:#a35f00;--rx-need-bg:#a35f0014}
.rx-page{width:min(1120px,100%);margin:0 auto;padding-block:28px 96px}
.rx-search,.rx-stage>*,.rx-now{min-width:0}
.rx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
code{font-family:var(--anatomy-mono);font-size:.92em}

/* header */
.rx-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:18px}
.rx-brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.rx-brand b{font:600 15px var(--anatomy-mono);color:var(--anatomy-strong);letter-spacing:.04em}
.rx-brand span{font:11px var(--anatomy-mono);color:var(--anatomy-muted);letter-spacing:.08em;text-transform:uppercase}
.rx-search{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 520px;max-width:720px}
.rx-search select{flex:0 1 230px;min-width:0;background:var(--anatomy-card);border:1px solid var(--anatomy-lo);color:var(--anatomy-strong);font:13px var(--anatomy-mono);padding:9px 8px;max-width:100%}
.rx-search select:focus{outline:2px solid var(--anatomy-lit);outline-offset:1px}
.rx-engine{flex-basis:100%;margin:0;font:11px var(--anatomy-mono);color:var(--anatomy-muted)}
.rx-search input{flex:1 1 200px;min-width:0;background:var(--anatomy-card);border:1px solid var(--anatomy-lo);color:var(--anatomy-strong);font:14px var(--anatomy-mono);padding:10px 12px}
.rx-search input:focus{outline:2px solid var(--anatomy-lit);outline-offset:1px}
.rx-tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:12.5px var(--anatomy-mono);color:var(--anatomy-text);background:transparent;border:1px solid var(--anatomy-faint);padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--anatomy-mid);color:var(--anatomy-strong)}
button:focus-visible,.rx-organ:focus-visible,a:focus-visible{outline:2px solid var(--anatomy-lit);outline-offset:2px}
.rx-search button{background:var(--anatomy-strong);color:var(--anatomy-page);border-color:var(--anatomy-strong);font-weight:600}
.rx-lib{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.rx-chip{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;padding:6px 10px}
.rx-chip span{font-size:10.5px;color:var(--anatomy-muted)}
.rx-chip-local{border-style:dashed}

/* messages and banners */
.rx-msg{border:1px solid var(--anatomy-lo);background:var(--anatomy-card);padding:12px 16px;margin:0 0 18px;font-size:13.5px}
.rx-msg p{margin:0 0 8px}.rx-msg p:last-child{margin:0}
.rx-msg-warn{border-color:color-mix(in srgb,var(--anatomy-red) 55%,var(--anatomy-lo))}
.rx-msg-err{border-color:var(--anatomy-red)}
.rx-msg-actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.rx-json{width:100%;margin-top:8px;font:11.5px/1.4 var(--anatomy-mono)}
.rx-small{font-size:12px;color:var(--anatomy-muted)}
.rx-banner{margin:0 0 10px;padding:8px 12px;border-left:3px solid var(--anatomy-mid);background:var(--anatomy-card);font-size:12.5px}
.rx-banner-conf{border-left-color:var(--anatomy-red)}

/* the figure */
.rx-fig{margin:0 0 28px}
.rx-plate{padding:44px 18px 40px}
.rx-stage{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:18px;align-items:start}
.rx-pane{border:1px solid var(--anatomy-faint);padding:10px 10px 6px;transition:border-color .3s}
.rx-pane.rx-live{border-color:var(--anatomy-mid)}
.rx-pane-h{font:10.5px var(--anatomy-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--anatomy-muted);margin-bottom:4px}
.rx-pane-h span{text-transform:none;letter-spacing:.02em}
.rx-body,.rx-cell{display:block;width:100%;height:auto}
.rx-body{overflow:visible}.rx-cell{overflow:hidden}
.rx-body{max-height:640px}
.rx-now{min-height:6.4em;margin:8px 2px 4px;border-left:2px solid var(--anatomy-faint);padding-left:10px}
.rx-now-k{font:10.5px var(--anatomy-mono);color:var(--anatomy-muted);text-transform:uppercase;letter-spacing:.08em}
.rx-now-t{display:block;color:var(--anatomy-strong);font:600 14px/1.4 var(--anatomy-mono);margin:2px 0}
.rx-now-p{margin:0;font-size:13.5px;line-height:1.55}
.rx-cite{font:10px var(--anatomy-mono);margin-left:2px}
.rx-cite a{color:var(--anatomy-muted);text-decoration:none}
.rx-cite a:hover{color:var(--anatomy-strong);text-decoration:underline}

/* body map */
.rx-sil{fill:var(--anatomy-shade-2);stroke:var(--anatomy-mid);stroke-width:1.1}
.rx-vessels path{fill:none;stroke:var(--anatomy-lo);stroke-width:1.1;stroke-linecap:round;transition:stroke .4s}
.rx-blood-on .rx-vessels path{stroke:var(--anatomy-red);stroke-opacity:.75}
.rx-all-on .rx-sil{stroke:var(--anatomy-lit)}
.rx-o{fill:var(--anatomy-shade-3);stroke:var(--anatomy-mid);stroke-width:1;transition:fill .35s,stroke .35s}
.rx-o-line{fill:none;stroke:var(--anatomy-mid);stroke-width:.9;stroke-linecap:round}
.rx-o-strong{stroke-width:1.6}
.rx-o-tube{fill:none;stroke:var(--anatomy-mid);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .35s}
.rx-o-thin{stroke-width:3.4}
.rx-bone{fill:none;stroke:var(--anatomy-lo);stroke-width:6;stroke-linecap:round}
.rx-marrow{fill:none;stroke:var(--anatomy-shade-3);stroke-width:2;stroke-linecap:round;transition:stroke .35s}
.rx-cord{fill:none;stroke:var(--anatomy-lo);stroke-width:2.4;stroke-dasharray:1 3;stroke-linecap:round;transition:stroke .35s}
.rx-organ{cursor:pointer;outline:none}
.rx-organ.rx-on .rx-o,.rx-organ.rx-hover .rx-o{fill:var(--anatomy-faint);stroke:var(--anatomy-lit);stroke-width:1.5}
.rx-organ.rx-on .rx-o-line,.rx-organ.rx-hover .rx-o-line{stroke:var(--anatomy-lit)}
.rx-organ.rx-on .rx-o-tube,.rx-organ.rx-hover .rx-o-tube{stroke:var(--anatomy-hi)}
.rx-organ.rx-on .rx-marrow,.rx-organ.rx-hover .rx-marrow{stroke:var(--anatomy-lit)}
.rx-organ.rx-on .rx-cord,.rx-organ.rx-hover .rx-cord{stroke:var(--anatomy-lit);stroke-dasharray:none}
.rx-tumor{stroke-dasharray:2 1.5}
.rx-dots circle{fill:var(--rx-drug);stroke:var(--anatomy-paper);stroke-width:.8}
.rx-leader{fill:none;stroke:var(--anatomy-mid);stroke-width:.8;stroke-dasharray:2 2}
.rx-site-label{fill:var(--anatomy-strong);font:600 11px var(--anatomy-mono)}

/* cell scenes */
.rx-cell{--glow:.1;--heat:.05;--hurt:0}
.rx-cyto{fill:var(--anatomy-shade-3)}
.rx-mem circle{fill:var(--anatomy-paper);stroke:var(--anatomy-mid);stroke-width:.8}
.rx-mem-core{fill:var(--anatomy-shade-1)}
.rx-nuc-env{fill:none;stroke:var(--anatomy-mid);stroke-width:1.1}
.rx-thin{stroke-width:.7}
.rx-nuc-glow{fill:var(--rx-sig);opacity:calc(var(--glow) * .32);transition:opacity .3s}
.rx-chrom{fill:none;stroke:var(--anatomy-lo);stroke-width:1.4}
.rx-lab{fill:var(--anatomy-text);font:10.5px var(--anatomy-mono)}
.rx-zone{fill:var(--anatomy-muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em}
.rx-strong{fill:var(--anatomy-strong);font-weight:600}
.rx-lead{fill:none;stroke:var(--anatomy-mid);stroke-width:.8}
.rx-rec{fill:var(--anatomy-face);stroke:var(--anatomy-hi);stroke-width:1.2}
.rx-rec-alt{fill:var(--anatomy-shade-1);stroke:var(--anatomy-mid)}
.rx-rec-tm{fill:none;stroke:var(--anatomy-lo);stroke-width:.8}
.rx-stalk{fill:none;stroke:var(--anatomy-hi);stroke-width:1.6;stroke-linecap:round}
.rx-enz{fill:var(--anatomy-face);stroke:var(--anatomy-hi);stroke-width:1.2;transition:opacity .3s}
.rx-off .rx-enz{opacity:.45}
.rx-sub{fill:var(--anatomy-shade-1);stroke:var(--anatomy-mid);stroke-width:1}
.rx-p{fill:var(--anatomy-page);font:700 6.5px var(--anatomy-mono)}
.rx-drug-g{fill:var(--rx-drug);stroke:var(--anatomy-paper);stroke-width:.9}
.rx-drug-l{stroke:var(--anatomy-paper);stroke-width:1}
.rx-ab{fill:none;stroke:var(--rx-drug);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rx-ab.rx-thin{stroke-width:1.8}
.rx-native-g{fill:var(--anatomy-mid);stroke:var(--anatomy-paper);stroke-width:.8}
.rx-pulse{fill:none;stroke:var(--rx-sig);stroke-width:1.4}
.rx-sig{fill:var(--rx-sig)}
.rx-ion{fill:var(--anatomy-blue);opacity:.9}
.rx-dna{fill:none;stroke:var(--anatomy-mid);stroke-width:2}
.rx-dna.rx-thin{stroke-width:1.2}
.rx-dna.rx-hot{stroke:var(--rx-drug);stroke-width:2.6}
.rx-rna{fill:none;stroke:var(--rx-rna);stroke-width:1.8;stroke-linecap:round}
.rx-cap{fill:var(--anatomy-face);stroke:var(--rx-drug);stroke-width:1.4}
.rx-cap-i{fill:none;stroke:var(--rx-drug);stroke-width:.7;opacity:.7}
.rx-endo{fill:none;stroke:var(--anatomy-mid);stroke-width:1.2;stroke-dasharray:3 2}
.rx-epi{fill:none;stroke:var(--rx-drug);stroke-width:1.8}
.rx-ribo{fill:var(--anatomy-shade-1);stroke:var(--anatomy-mid);stroke-width:1}
.rx-prot{fill:var(--rx-sig);stroke:var(--anatomy-paper);stroke-width:.8}
.rx-heat{fill:var(--rx-sig);opacity:calc(var(--heat) * .26);pointer-events:none}
.rx-hurt{fill:var(--rx-bad);opacity:calc(var(--hurt) * .32);pointer-events:none}
.rx-brake{stroke:var(--rx-bad);stroke-width:3;stroke-linecap:round}
.rx-clone{fill:var(--anatomy-shade-2);stroke:var(--anatomy-hi);stroke-width:1.2}
.rx-clone-n{fill:none;stroke:var(--anatomy-mid);stroke-width:1}

/* controls and step list */
.rx-controls{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;margin:14px 2px 6px;font:12.5px var(--anatomy-mono)}
.rx-group{display:flex;gap:6px}
.rx-group [data-act="play"]{min-width:74px}
.rx-range{display:flex;flex-direction:column;gap:2px;flex:1 1 280px;max-width:420px}
.rx-range input{accent-color:var(--anatomy-lit);width:100%}
.rx-gl{color:var(--anatomy-muted);font-size:11.5px}
.rx-ticks{display:flex;justify-content:space-between;color:var(--anatomy-muted);font-size:10.5px}
.rx-ticks i{font-style:normal}
.rx-steps{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:6px}
.rx-steps button{width:100%;text-align:left;display:flex;flex-direction:column;gap:1px;line-height:1.3;padding:7px 9px;font-size:12px;color:var(--anatomy-text)}
.rx-steps button em{font-style:normal;font-size:10px;color:var(--anatomy-muted)}
.rx-step-k{font-size:10px;color:var(--anatomy-muted);text-transform:uppercase;letter-spacing:.08em}
.rx-steps button.rx-done{border-color:var(--anatomy-lo)}
.rx-steps button[aria-current="step"]{border-color:var(--anatomy-lit);color:var(--anatomy-strong);background:var(--anatomy-shade-2)}
.rx-plate .iso-plate-corner[data-corner="hint"]{bottom:0}

/* facts, sources */
.rx-facts{margin:0 0 20px;display:grid;grid-template-columns:auto 1fr;gap:4px 24px;align-items:start}
.rx-facts h2,.bio-sources h2{grid-column:1/-1;font:600 13px var(--anatomy-mono);color:var(--anatomy-text);margin:0 0 8px}
.rx-facts dl{grid-column:2;margin:0;display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:0}
.rx-facts:not(:has(.rx-struct)) dl{grid-column:1/-1}
.rx-facts dl div{display:contents}
.rx-facts dt,.rx-facts dd{margin:0;padding:7px 0;border-top:1px solid var(--anatomy-faint);font-size:13px}
.rx-facts dt{color:var(--anatomy-muted);padding-right:16px}
.rx-facts dd{color:var(--anatomy-strong)}
.rx-struct{margin:0;grid-column:1;text-align:center;font:10.5px var(--anatomy-mono);color:var(--anatomy-muted)}
.rx-struct img{display:block;background:#fff;border:1px solid var(--anatomy-faint)}
.iso[data-theme="dark"] .rx-struct img{filter:invert(.92) hue-rotate(180deg)}
.bio-sources{margin:20px 2px;color:var(--anatomy-muted);font-size:12.5px;line-height:1.65}
.bio-sources ol,.bio-sources ul{padding-left:20px}.bio-sources li{margin:6px 0}
.bio-sources a{color:var(--anatomy-text);text-underline-offset:2px;overflow-wrap:anywhere}
.rx-note{border-left:2px solid var(--anatomy-faint);padding-left:10px}

/* editor */
.rx-edit{margin:28px 0;border:1px solid var(--anatomy-faint);background:var(--anatomy-card)}
.rx-edit>summary{cursor:pointer;padding:12px 16px;font:600 13px var(--anatomy-mono);color:var(--anatomy-strong)}
#rx-form{padding:0 16px 16px}
.rx-edit fieldset{border:1px solid var(--anatomy-faint);margin:0 0 14px;padding:10px 12px 12px}
.rx-edit legend{font:11px var(--anatomy-mono);color:var(--anatomy-muted);text-transform:uppercase;letter-spacing:.08em;padding:0 6px}
.rx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
.rx-f{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--anatomy-muted)}
.rx-f-wide{grid-column:1/-1}
.rx-check{grid-column:1/-1;font-size:12.5px;display:flex;gap:8px;align-items:center}
.rx-edit input:not([type]),.rx-edit input[type="text"],.rx-edit select,.rx-edit textarea{width:100%;background:var(--anatomy-page);border:1px solid var(--anatomy-lo);color:var(--anatomy-strong);font:12.5px var(--anatomy-mono);padding:6px 8px}
.rx-edit textarea{resize:vertical;font-family:inherit;font-size:13px}
.rx-rows{display:flex;flex-direction:column;gap:8px}
.rx-row{display:grid;grid-template-columns:150px minmax(120px,1fr) minmax(160px,2fr) 64px auto auto;gap:6px;align-items:start}
[data-list="mechanism"] .rx-row{grid-template-columns:minmax(120px,1fr) minmax(160px,2.4fr) 64px auto}
[data-list="facts"] .rx-row{grid-template-columns:minmax(120px,1fr) minmax(160px,2fr) 64px auto}
[data-list="sources"] .rx-row{grid-template-columns:22px minmax(160px,2fr) minmax(120px,1fr) auto}
.rx-src-n{font:12px var(--anatomy-mono);padding-top:6px}
.rx-tgt{font-size:11.5px;display:flex;gap:4px;align-items:center;padding-top:6px;white-space:nowrap}
.rx-row-btns{display:flex;gap:3px}
.rx-row-btns button{padding:5px 7px}
.rx-add{align-self:flex-start;border-style:dashed}
.rx-inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.rx-inline select{width:auto}
.rx-edit-actions{margin:4px 0 0}

footer.rx-foot{margin-top:40px;font-size:12px;color:var(--anatomy-muted)}
footer.rx-foot a{color:var(--anatomy-text)}

@media(max-width:860px){
  .rx-stage{grid-template-columns:1fr}
  .rx-body{max-height:480px}
  .rx-row,[data-list] .rx-row{grid-template-columns:1fr 1fr}
  .rx-row textarea{grid-column:1/-1}
  .rx-facts{grid-template-columns:1fr}.rx-facts dl{grid-column:1}
}
@media(max-width:560px){
  .rx-plate{padding:40px 8px 74px}
  .iso-plate-corner[data-corner="readout"]{white-space:normal;text-align:right;max-width:58%;line-height:1.3}
  .iso-plate-corner[data-corner="hint"]{display:none}
  .rx-facts dl{grid-template-columns:1fr}.rx-facts dt{border-top:1px solid var(--anatomy-faint);padding-bottom:0}.rx-facts dd{border-top:0;padding-top:2px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* fields that still need the user's input */
.rx-needs{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;padding:10px 12px;border:1px solid var(--rx-need);background:var(--rx-need-bg)}
.rx-needs>div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rx-needs-h{font:600 11.5px var(--anatomy-mono);color:var(--anatomy-text);margin-right:4px}
.rx-needs-h.rx-req{color:var(--rx-need)}
.rx-need-chip{font-size:11.5px;padding:4px 8px;border-style:dashed}
.rx-need-chip.rx-req{border:1px solid var(--rx-need);border-style:solid;color:var(--anatomy-strong)}
.rx-flag{display:block;font-style:normal;font-size:10px;color:var(--anatomy-muted)}
.rx-flag.rx-req{color:var(--rx-need);font-weight:600}
.rx-steps button:has(.rx-flag.rx-req){border-color:var(--rx-need)}
.rx-now-need{display:block;margin-top:6px;font-size:12px;color:var(--anatomy-muted)}
.rx-now-need button{font-size:11.5px;padding:3px 7px;border-style:dashed}
.rx-now-need.rx-req button{border:1px solid var(--rx-need);color:var(--anatomy-strong)}
.rx-missing{color:var(--anatomy-muted);font-style:italic}
.rx-need-cell{font-size:11.5px;padding:3px 7px;border-style:dashed;color:var(--anatomy-muted)}
.rx-need-cell.rx-req{border:1px solid var(--rx-need);border-style:solid;color:var(--anatomy-strong)}
.rx-edit .rx-need{outline:2px solid var(--rx-need)!important;outline-offset:1px;background:var(--rx-need-bg)!important}
.rx-edit .rx-need-opt{outline:1px dashed var(--rx-need);outline-offset:1px}
.rx-edit fieldset.rx-need,.rx-edit fieldset.rx-need-opt{outline-offset:-1px}
.rx-need-note{display:block;grid-column:1/-1;font:11px var(--anatomy-mono);color:var(--anatomy-muted);margin:3px 0 2px}
.rx-need-note.rx-req{color:var(--rx-need);font-weight:600}
.rx-key{display:inline-flex;align-items:center;gap:5px;margin-left:10px}
.rx-key i{width:12px;height:12px;display:inline-block;outline:1px dashed var(--rx-need)}
.rx-key i.rx-req{outline:2px solid var(--rx-need);background:var(--rx-need-bg)}

was found in 93% of adults with indolent or aggressive SM, and in about a third of them also in CD34+ progenitors and eosinophils.","cite":[3],"target":true},{"site":"liver","title":"Metabolised","text":"Most oral kinase inhibitors are metabolised in the liver, often by CYP3A4. The metabolic pathway of bezuclastinib has not been published.","generic":true},{"site":"intestine","title":"Eliminated","text":"Kinase inhibitors and their metabolites usually leave mainly in bile and feces, with a smaller share in urine. Mass-balance data for bezuclastinib have not been published.","generic":true}],"mechanism":[{"title":"Enters the mast cell","text":"As a small molecule, bezuclastinib crosses the cell membrane to reach the kinase domain of KIT, which sits on the inside of the membrane.","generic":true},{"title":"Binds the active kinase","text":"It is a type I inhibitor: it binds the ATP site of KIT D816V while the kinase is in its active conformation. Sunitinib, its partner in GIST, is a type II inhibitor that binds the inactive conformation.","cite":[1,4]},{"title":"The always-on signal stops","text":"D816V switches KIT on without its ligand, stem cell factor (SCF). With the ATP site blocked, the mutant kinase can no longer phosphorylate its substrates, and the growth and survival signal stops.","cite":[5,2]},{"title":"Mast-cell burden falls","text":"Neoplastic mast cells depend on this signal, so they decline. In the APEX trial in advanced SM, 65% of 68 evaluable patients responded by mIWG-MRC criteria.","cite":[6]}],"facts":[{"label":"Molecule","value":"Oral, selective type I tyrosine kinase inhibitor","cite":[1]},{"label":"Primary target","value":"KIT D816V (exon 17); preclinical activity against KIT exon 9, 11, 17 and 18 mutations","cite":[2]},{"label":"Selectivity","value":"Spares closely related kinases; minimal brain penetration in preclinical studies (company data)","cite":[1,2]},{"label":"Why KIT D816V","value":"Present in 93% of adults with indolent or aggressive SM (Spanish REMA network, n = 113)","cite":[3]},{"label":"GIST combination","value":"With sunitinib (type II), covers both KIT conformations. PEAK phase 3: median PFS 16.5 vs 9.2 months, HR 0.50","cite":[4,7]},{"label":"Regulatory status","value":"Not approved. FDA target action dates: GIST with sunitinib 30 Nov 2026; nonadvanced SM 30 Dec 2026; advanced SM 29 Jun 2027","cite":[8]}],"needs":[{"path":"journey[2].text","label":"Oral bioavailability and food effect","why":"Not published. Add from the Investigator's Brochure or clinical pharmacology report if you have it.","required":false},{"path":"journey[6].text","label":"Metabolic pathway (main CYP enzymes)","why":"Not published. The step shows what is typical for oral kinase inhibitors.","required":false},{"path":"journey[7].text","label":"Elimination route (feces / urine split)","why":"No mass-balance study published.","required":false},{"path":"fact:Elimination half-life","label":"Elimination half-life","why":"Human half-life not published.","required":false},{"path":"fact:Plasma protein binding","label":"Plasma protein binding","why":"Not published.","required":false}],"simplified":["KIT is drawn with one extracellular domain and one kinase domain. The real receptor has five immunoglobulin-like domains, a juxtamembrane region and a split kinase domain, and it signals as a dimer.","Downstream KIT signalling (for example PI3K/AKT, STAT5 and RAS/MAPK) is drawn as one growth-and-survival signal.","Systemic mastocytosis also involves mast cells in skin, gut, liver and spleen; the figure follows the bone marrow only.","Steps marked typical describe oral kinase inhibitors in general, because bezuclastinib's human pharmacokinetics have not been published."],"sources":[{"id":1,"text":"OncLive. Bezuclastinib demonstrates early promise in advanced systemic mastocytosis (APEX trial coverage; describes bezuclastinib as an oral, potent, selective type I TKI that spares closely related kinases, with minimal brain penetration).","url":"https://onclive.com/view/bezuclastinib-demonstrates-early-promise-in-advanced-systemic-mastocytosis"},{"id":2,"text":"Cogent Biosciences. Preclinical data identifies bezuclastinib as a differentiated KIT inhibitor with unique selectivity to KIT D816V and minimal evidence of brain penetration. Poster, AACR-NCI-EORTC Molecular Targets, October 2021. Company-sponsored.","url":"https://www.cogentbio.com/wp-content/uploads/2022/08/october-2021_Cogent_Bezu_MolTargets21_Final.pdf"},{"id":3,"text":"Garcia-Montero AC, Jara-Acevedo M, Teodosio C, et al. KIT mutation in mast cells and other bone marrow hematopoietic cell lineages in systemic mast cell disorders. Blood. 2006;108(7):2366–2372.","url":"https://pubmed.ncbi.nlm.nih.gov/?term=Garcia-Montero+KIT+mutation+mast+cells+Blood+2006"},{"id":4,"text":"Wagner AJ, et al. Association of combination of conformation-specific KIT inhibitors with clinical benefit in patients with refractory gastrointestinal stromal tumors: a phase 1b/2a nonrandomized clinical trial (PLX9486 with sunitinib, NCT02401815). JAMA Oncol. 2021;7(9):1343–1350.","url":"https://pubmed.ncbi.nlm.nih.gov/?term=Wagner+conformation-specific+KIT+inhibitors+JAMA+Oncol+2021"},{"id":5,"text":"Furitsu T, Tsujimura T, Tono T, et al. Identification of mutations in the coding sequence of the proto-oncogene c-kit in a human mast cell leukemia cell line causing ligand-independent activation of c-kit product. J Clin Invest. 1993;92(4):1736–1744.","url":"https://pubmed.ncbi.nlm.nih.gov/?term=Furitsu+c-kit+ligand-independent+activation+1993"},{"id":6,"text":"Cogent Biosciences. Positive top-line results of APEX trial of bezuclastinib in patients with advanced systemic mastocytosis (press release; Part 2, 68 evaluable patients, ORR 65% per mIWG-MRC).","url":"https://investors.cogentbio.com/news-releases/news-release-details/cogent-biosciences-announces-positive-top-line-results-apex"},{"id":7,"text":"CancerNetwork. Bezuclastinib plus sunitinib meets PFS end point in KIT-mutant GIST (PEAK phase 3; median PFS 16.5 vs 9.2 months, HR 0.50, 95% CI 0.39–0.65). May 30, 2026.","url":"https://www.cancernetwork.com/view/bezuclastinib-plus-sunitinib-meets-pfs-end-point-in-kit-mutant-gist"},{"id":8,"text":"Drugs.com. Bezuclastinib FDA approval status and NDA history (GIST priority review, PDUFA 30 Nov 2026; nonadvanced SM, 30 Dec 2026; advanced SM, 29 Jun 2027). Checked 17 Oct 2026.","url":"https://www.drugs.com/history/bezuclastinib.html"}]},{"id":"imatinib","name":"Imatinib","aliases":["STI571","STI-571","Gleevec","Glivec","CGP 57148B","imatinib mesylate"],"route":"oral","modality":"small-molecule","status":"Approved","summary":"A small-molecule kinase inhibitor. It holds the BCR-ABL tyrosine kinase, the abnormal enzyme made by the Philadelphia chromosome in chronic myeloid leukemia, in an inactive shape, so the growth signal it drives stops.","target":{"name":"BCR-ABL tyrosine kinase","short":"BCR-ABL","class":"enzyme","action":"inhibitor","cell":"Philadelphia-chromosome-positive leukemic cell","labels":{"pocket":"ATP site","product":"phosphorylated substrate","signal":"growth signal"}},"binding":true,"journey":[{"site":"mouth","title":"Swallowed","text":"Imatinib is taken by mouth as a tablet.","cite":[1]},{"site":"stomach","title":"Dissolves","text":"The tablet dissolves and the drug moves on to the small intestine."},{"site":"intestine","title":"Absorbed","text":"Imatinib crosses the intestinal wall into the portal blood. Absorption is nearly complete: mean absolute bioavailability of the capsule formulation is 98%.","cite":[1]},{"site":"liver","title":"First pass through the liver","text":"Portal blood carries it through the liver before it reaches the general circulation. Little is lost on this pass, consistent with the 98% bioavailability.","cite":[1]},{"site":"blood","title":"Carried in the blood","text":"About 95% is bound to plasma proteins, mostly albumin and α1-acid glycoprotein. Only the unbound fraction can leave the blood and enter cells.","cite":[1]},{"site":"bone-marrow","title":"Reaches the leukemic cells","text":"In chronic myeloid leukemia the target cells are Philadelphia-chromosome-positive cells in the bone marrow and blood.","cite":[1],"target":true},{"site":"liver","title":"Metabolised","text":"CYP3A4 is the main enzyme that metabolises imatinib. The main circulating metabolite, the N-desmethyl piperazine derivative, is also active. Half-lives are about 18 h for imatinib and 40 h for the metabolite.","cite":[1]},{"site":"intestine","title":"Eliminated, mostly in feces","text":"About 81% of a dose is eliminated within 7 days, 68% of it in feces (via bile), mostly as metabolites.","cite":[1]},{"site":"bladder","title":"and some in urine","text":"The remaining 13% of the dose that is eliminated in 7 days leaves in urine.","cite":[1]}],"mechanism":[{"title":"Enters the cell","text":"Imatinib crosses the cell membrane to reach BCR-ABL, which sits in the cytoplasm.","cite":[1]},{"title":"Locks the kinase shut","text":"It binds the ATP site of the ABL kinase domain while the kinase is in its inactive conformation, and holds it there.","cite":[2]},{"title":"No phosphate is passed on","text":"With the site occupied, BCR-ABL cannot move phosphate from ATP onto its substrate proteins, so the growth signal it drives stops.","cite":[1,2]},{"title":"The leukemic cell stops growing","text":"Without BCR-ABL signalling, BCR-ABL-positive cells stop proliferating and many undergo apoptosis (programmed cell death).","cite":[1]}],"facts":[{"label":"Absolute bioavailability","value":"98% (capsule formulation, mean)","cite":[1]},{"label":"Plasma protein binding","value":"≈95%, mostly albumin and α1-acid glycoprotein","cite":[1]},{"label":"Main metabolising enzyme","value":"CYP3A4","cite":[1]},{"label":"Elimination half-life","value":"≈18 h (imatinib), ≈40 h (N-desmethyl metabolite)","cite":[1]},{"label":"Elimination within 7 days","value":"≈81% of dose: 68% feces, 13% urine","cite":[1]},{"label":"Other kinases inhibited","value":"PDGF receptor and KIT (stem cell factor receptor)","cite":[1]}],"simplified":["Uptake into the cell is drawn as simple diffusion; transporters such as OCT-1 may contribute and their role is debated.","BCR-ABL drives several pathways (for example RAS/MAPK, PI3K/AKT and STAT5); they are drawn as one growth signal.","The body map is a schematic. Organ shapes and positions are approximate and not to scale."],"sources":[{"id":1,"text":"Gleevec (imatinib mesylate) tablets, US Prescribing Information, Novartis. Sections 12.1 Mechanism of Action and 12.3 Pharmacokinetics.","url":"https://dailymed.nlm.nih.gov/dailymed/search.cfm?labeltype=all&query=gleevec"},{"id":2,"text":"Schindler T, Bornmann W, Pellicena P, Miller WT, Clarkson B, Kuriyan J. Structural mechanism for STI-571 inhibition of Abelson tyrosine kinase. Science. 2000;289(5486):1938–1942.","url":"https://doi.org/10.1126/science.289.5486.1938"}]},{"id":"onasemnogene-abeparvovec","name":"Onasemnogene abeparvovec","aliases":["Zolgensma","AVXS-101","onasemnogene"],"route":"gene-iv","modality":"gene-therapy","status":"Approved","summary":"An AAV9 gene therapy for spinal muscular atrophy. A non-replicating viral capsid carries a working copy of the gene for SMN protein into motor neurons, where it is expressed without integrating into the chromosomes.","target":{"name":"SMN gene replacement in motor neurons","short":"SMN","class":"gene","action":"expression","vector":"AAV","cell":"Spinal motor neuron","labels":{"vector":"AAV9 capsid","transgene":"SMN transgene","protein":"SMN protein"}},"binding":false,"journey":[{"site":"iv","title":"Infused into a vein","text":"Given once as an intravenous infusion.","cite":[1]},{"site":"blood","title":"Carried in the blood","text":"The AAV9 capsid can cross the blood–brain barrier, which lets an intravenous dose reach neurons in the spinal cord.","cite":[2]},{"site":"spinal-cord","title":"Reaches motor neurons","text":"In spinal muscular atrophy, motor neurons in the spinal cord lack enough SMN protein because SMN1 is lost or mutated.","cite":[1],"target":true},{"site":"liver","title":"Also reaches the liver","text":"AAV9 also transduces the liver. Acute serious liver injury and acute liver failure carry a boxed warning, so liver function is monitored.","cite":[1]},{"site":"bladder","title":"Vector DNA is shed","text":"Vector DNA is shed for a time in saliva, urine and stool.","cite":[1]}],"mechanism":[{"title":"The capsid attaches","text":"The AAV9 capsid binds the cell surface and is taken up by endocytosis.","cite":[3]},{"title":"It travels to the nucleus","text":"The capsid escapes the endosome and moves toward the nucleus.","cite":[3]},{"title":"The gene is delivered","text":"In the nucleus the capsid releases its self-complementary DNA, which persists mostly as a separate episome rather than integrating into the chromosomes.","cite":[1,3]},{"title":"SMN protein is made","text":"The SMN transgene, driven by a CMV enhancer / chicken-β-actin hybrid promoter, is transcribed and translated into SMN protein.","cite":[1]}],"facts":[{"label":"Vector","value":"Non-replicating recombinant AAV9","cite":[1]},{"label":"Genome","value":"Self-complementary DNA carrying human SMN cDNA","cite":[1]},{"label":"Promoter","value":"CMV enhancer / chicken-β-actin hybrid","cite":[1]},{"label":"Fate in the nucleus","value":"Persists mostly as a non-integrated episome","cite":[3]},{"label":"Boxed warning","value":"Acute serious liver injury and acute liver failure","cite":[1]}],"simplified":["Receptor binding, endosomal escape and nuclear entry are each shown as one step. AAV entry involves several receptors and trafficking routes.","Uncoating is shown at the nucleus; where AAV capsids actually uncoat is still being studied.","The body map is a schematic. The spinal cord is drawn on the midline, in front of the organs, for visibility."],"sources":[{"id":1,"text":"ZOLGENSMA (onasemnogene abeparvovec-xioi) suspension for intravenous infusion, US Prescribing Information, Novartis Gene Therapies. Boxed warning, sections 11 and 12.","url":"https://dailymed.nlm.nih.gov/dailymed/search.cfm?labeltype=all&query=zolgensma"},{"id":2,"text":"Foust KD, Nurre E, Montgomery CL, Hernandez A, Chan CM, Kaspar BK. Intravascular AAV9 preferentially targets neonatal neurons and adult astrocytes. Nat Biotechnol. 2009;27(1):59–65.","url":"https://doi.org/10.1038/nbt.1515"},{"id":3,"text":"Wang D, Tai PWL, Gao G. Adeno-associated virus vector as a platform for gene therapy delivery. Nat Rev Drug Discov. 2019;18(5):358–378.","url":"https://doi.org/10.1038/s41573-019-0012-9"}]},{"id":"pembrolizumab","name":"Pembrolizumab","aliases":["Keytruda","MK-3475","lambrolizumab"],"route":"iv","modality":"antibody","status":"Approved","summary":"A humanised IgG4 monoclonal antibody against PD-1, an off switch on T cells. Blocking PD-1 stops tumour cells from using PD-L1 and PD-L2 to switch T cells off.","target":{"name":"PD-1 receptor on T cells","short":"PD-1","class":"checkpoint","action":"blocker","cell":"T cell facing a tumour cell","labels":{"receptor":"PD-1","ligand":"PD-L1","effector":"T cell","target":"tumour cell"}},"binding":true,"journey":[{"site":"iv","title":"Infused into a vein","text":"Pembrolizumab is given as an intravenous infusion, so it enters the bloodstream directly, with no absorption step.","cite":[1]},{"site":"blood","title":"Circulates for weeks","text":"Like other IgG antibodies it is rescued from breakdown by the neonatal Fc receptor (FcRn), which helps give it a terminal half-life of about 22 days.","cite":[1,2]},{"site":"lymph-nodes","title":"Meets T cells in lymph nodes","text":"PD-1 is found on activated T cells. Blocking it can act on T cells in lymph nodes as well as in the tumour.","cite":[3]},{"site":"tumor","title":"Reaches the tumour","text":"In the tumour, tumour cells and some immune cells can display PD-L1, which switches T cells off through PD-1.","cite":[1,3],"target":true},{"site":"tissues","title":"Broken down like other proteins","text":"Antibodies are cleared mainly by protein catabolism inside cells throughout the body, not by liver CYP enzymes or kidney filtration of the intact molecule.","cite":[2]}],"mechanism":[{"title":"The brake is on","text":"PD-L1 or PD-L2 on the tumour cell engages PD-1 on the T cell and damps down its activity.","cite":[1]},{"title":"Pembrolizumab binds PD-1","text":"The antibody binds PD-1 and blocks its interaction with PD-L1 and PD-L2.","cite":[1]},{"title":"The brake is released","text":"Releasing PD-1 pathway inhibition restores T-cell activity, including the anti-tumour response.","cite":[1]},{"title":"T cells attack the tumour","text":"Reactivated T cells can recognise and kill tumour cells. The same release of brakes on T cells in healthy tissue causes immune-mediated side effects.","cite":[1,3]}],"facts":[{"label":"Molecule","value":"Humanised monoclonal IgG4-κ antibody","cite":[1]},{"label":"Target","value":"PD-1; blocks binding of PD-L1 and PD-L2","cite":[1]},{"label":"Terminal half-life","value":"≈22 days","cite":[1]},{"label":"Clearance","value":"Protein catabolism; no CYP metabolism","cite":[2]}],"simplified":["The tumour–T-cell contact is drawn as one flat interface. Real immune synapses are 3D and hold many other receptor pairs.","T-cell activation also needs the T-cell receptor to recognise antigen on MHC; the figure shows only the PD-1 brake.","The body map is a schematic, and the tumour position is illustrative only."],"sources":[{"id":1,"text":"KEYTRUDA (pembrolizumab) injection, US Prescribing Information, Merck Sharp & Dohme. Sections 12.1 Mechanism of Action and 12.3 Pharmacokinetics.","url":"https://dailymed.nlm.nih.gov/dailymed/search.cfm?labeltype=all&query=keytruda"},{"id":2,"text":"Ryman JT, Meibohm B. Pharmacokinetics of monoclonal antibodies. CPT Pharmacometrics Syst Pharmacol. 2017;6(9):576–588.","url":"https://doi.org/10.1002/psp4.12224"},{"id":3,"text":"Ribas A, Wolchok JD. Cancer immunotherapy using checkpoint blockade. Science. 2018;359(6382):1350–1355.","url":"https://doi.org/10.1126/science.aar4060"}]},{"id":"tisagenlecleucel","name":"Tisagenlecleucel","aliases":["Kymriah","CTL019","tisa-cel"],"route":"ex-vivo","modality":"cell-therapy","status":"Approved","summary":"An autologous CAR-T cell therapy. The patient's own T cells are engineered with a lentiviral vector to carry a chimeric antigen receptor (CAR) against CD19, then given back to find and kill CD19-positive B cells.","target":{"name":"CD19 on B cells","short":"CD19","class":"car","action":"cytotoxic","cell":"CAR-T cell meeting a malignant B cell","labels":{"receptor":"anti-CD19 CAR","antigen":"CD19","effector":"CAR-T cell","target":"malignant B cell"}},"binding":false,"journey":[{"site":"iv","title":"T cells are collected","text":"White blood cells are collected from the patient's own blood by leukapheresis.","cite":[1]},{"site":"ex-vivo","title":"Engineered outside the body","text":"At the manufacturing site, the T cells are transduced with a lentiviral vector encoding the anti-CD19 CAR, expanded, then formulated and cryopreserved as the drug product.","cite":[1]},{"site":"iv","title":"Infused back","text":"The patient's own modified T cells are returned by intravenous infusion.","cite":[1]},{"site":"blood","title":"Expands inside the patient","text":"On meeting CD19, the CAR-T cells multiply. Unlike a conventional drug, the product keeps growing after it is given.","cite":[1]},{"site":"bone-marrow","title":"Finds CD19-positive cells","text":"CD19 is present on normal and malignant B cells in the blood, bone marrow and lymphoid tissue.","cite":[1,2],"target":true},{"site":"lymph-nodes","title":"Persists and patrols","text":"CAR-T cells can persist for months, so normal B cells can stay depleted (B-cell aplasia) for a long time.","cite":[2]}],"mechanism":[{"title":"The CAR finds CD19","text":"The CAR's murine anti-CD19 single-chain variable fragment (scFv) binds CD19 on the B cell.","cite":[1]},{"title":"The T cell switches on","text":"Binding signals through the CAR's 4-1BB (CD137) and CD3ζ domains and activates the T cell without needing antigen presented on MHC.","cite":[1,3]},{"title":"It kills the target cell","text":"The activated CAR-T cell releases cytotoxic granules and cytokines that kill the CD19-positive cell.","cite":[3]},{"title":"It multiplies and persists","text":"Activation drives expansion and persistence. The cytokine surge from mass activation is the source of cytokine release syndrome.","cite":[1]}],"facts":[{"label":"Product","value":"Autologous T cells modified with a lentiviral vector","cite":[1]},{"label":"CAR design","value":"Murine anti-CD19 scFv · CD8α hinge and transmembrane · 4-1BB · CD3ζ","cite":[1]},{"label":"Antigen","value":"CD19 (normal and malignant B cells)","cite":[1]},{"label":"Boxed warnings","value":"Cytokine release syndrome; neurological toxicities","cite":[1]}],"simplified":["Manufacturing is shown as a single ex-vivo step. The real process includes T-cell activation, transduction, expansion, formulation, release testing and cryopreservation.","Killing is drawn as granule release; cytokine-mediated and other killing routes are not shown separately.","The body map is a schematic; organ shapes and positions are approximate."],"sources":[{"id":1,"text":"KYMRIAH (tisagenlecleucel) suspension for intravenous infusion, US Prescribing Information, Novartis. Boxed warning, sections 11 Description and 12.1 Mechanism of Action.","url":"https://dailymed.nlm.nih.gov/dailymed/search.cfm?labeltype=all&query=kymriah"},{"id":2,"text":"Maude SL, Laetsch TW, Buechner J, et al. Tisagenlecleucel in children and young adults with B-cell lymphoblastic leukemia. N Engl J Med. 2018;378(5):439–448.","url":"https://doi.org/10.1056/NEJMoa1709866"},{"id":3,"text":"June CH, Sadelain M. Chimeric antigen receptor therapy. N Engl J Med. 2018;379(1):64–73.","url":"https://doi.org/10.1056/NEJMra1706169"}]}];window.__RX_INITIAL__=   const drugGlyph = (mod) => (mod === "antibody" ? GLYPH.antibody : mod === "protein" || mod === "peptide" ? GLYPH.protein : mod === "oligonucleotide" ? GLYPH.duplex : GLYPH.hex);
  const g = (k, i, inner, cls = "") => `<g data-k="${k}" data-i="${i}" class="${cls}">${inner}</g>`;
  const mv = (el, p, op, sc) => {
    if (!el) return;
    el.setAttribute("transform", `translate(${f1(p[0])} ${f1(p[1])})${sc != null && sc !== 1 ? ` scale(${f1(sc * 100) / 100})` : ""}`);
    if (op != null) el.style.opacity = f1(clamp(op) * 100) / 100;
  };
  const pulse = (el, x, y, t, i, on, rMax = 18) => {
    if (!el) return;
    const u = ph(t, 1.5, i * 0.31);
    el.setAttribute("cx", x); el.setAttribute("cy", y); el.setAttribute("r", f1(3 + rMax * u));
    el.style.opacity = on ? f1((1 - u) * 0.85 * on * 100) / 100 : 0;
  };
  const isUp = (a) => /agon|activ|potent|open|stimul|enhanc|induc|express|replace/.test(lower(a)) && !/antag|inverse/.test(lower(a));
  const beatP = (s, b) => (s.beat < b ? 0 : s.beat > b ? 1 : s.p);
  const pct = (v) => `${Math.round(v * 100)}%`;

  /* ---------- the cell: scenes ---------- */

  function sceneReceptor(d, L) {
    const N = 5, xs = [60, 140, 220, 300, 380], order = [2, 0, 4, 1, 3];
    const up = isUp(d.target.action), antag = /antag|block/.test(lower(d.target.action));
    const recLabel = L.receptor || d.target.short || "receptor";
    const svg = `${sideLabels(30, 292)}<rect class="rx-cyto" x="-10" y="122" width="460" height="190"/>${bilayer(104)}${nucleus(345, 268, 92, 46)}
${xs.map((x, i) => g("rec", i, `<path class="rx-rec" d="M-11,92 L-4,92 L-2,98 L2,98 L4,92 L11,92 L11,136 C11,140 -11,140 -11,136 Z"/><path class="rx-rec-tm" d="M-6,98 L-6,134 M0,100 L0,134 M6,98 L6,134"/>`, "rx-recg")).join("")}
${xs.map((_, i) => `<circle class="rx-pulse" data-k="pulse" data-i="${i}" r="0"/>`).join("")}
${xs.map((_, i) => g("sig", i, `<circle class="rx-sig" r="2.6"/>`)).join("")}
${xs.map((_, i) => g("nat", i, GLYPH.native)).join("")}
${xs.map((_, i) => g("drug", i, drugGlyph(d.modality))).join("")}
${leader(60, 140, 60, 158)}${lab(40, 170, recLabel)}${lab(434, 20, d.name, "end", "rx-strong")}${lab(434, 33, up ? "agonist" : antag ? "blocks the natural ligand" : lower(d.target.action) || "binds the receptor", "end")}${lab(220, 196, "signal to the nucleus", "middle")}`;
    let level = 0, bound = 0;
    return {
      svg,
      steps: [
        [`${d.name} arrives`, `${d.name} reaches ${recLabel} on the cell surface.`],
        [`Binds ${recLabel}`, up ? `It binds the receptor in place of the natural ligand.` : antag ? `It occupies the receptor so the natural ligand cannot bind.` : `It binds the receptor and reduces its signalling.`],
        [up ? "Receptor switches on" : "Signalling falls", up ? "The bound receptor changes shape and starts the signalling cascade inside the cell." : "Fewer receptors are activated, so less signal crosses the membrane."],
        ["Cell response", up ? "The signal reaches the nucleus and changes what the cell does." : "The downstream response is reduced."],
      ],
      frame(R, s) {
        const k = s.beat < 0 ? 0 : Math.round(s.occ * N);
        const set = new Set(order.slice(0, k));
        let act = 0;
        xs.forEach((x, i) => {
          mv(R.rec[i], [x, 0]);
          const isB = set.has(i);
          const start = [x + (i % 2 ? 20 : -20), 22 + ((i * 7) % 18)];
          const a = s.beat < 0 ? 0 : s.beat === 0 ? 0.6 * s.p : 0.6 + 0.4 * beatP(s, 1);
          const wander = [x + 16 * Math.sin(s.t * 0.7 + i * 1.7), 40 + 10 * Math.cos(s.t * 0.9 + i)];
          const fade = s.beat < 0 ? 0 : s.beat === 0 ? Math.min(1, s.p * 3) : 1;
          mv(R.drug[i], isB ? mix(start, [x, 88], ease(a)) : wander, isB ? fade : fade * 0.55);
          const nativeOn = up ? i === 3 : true;
          const kicked = isB ? beatP(s, 1) : 0;
          mv(R.nat[i], mix([x, 86], [x + 18, 52 + 5 * Math.sin(s.t * 1.3 + i)], ease(kicked)), nativeOn ? 1 : 0);
          const active = up ? (isB ? beatP(s, 2) : i === 3 ? 1 : 0) : 1 - kicked;
          act += active;
          pulse(R.pulse[i], x, 150, s.t, i, active);
          const u = ph(s.t, 2.4, i * 0.21);
          mv(R.sig[i], mix([x, 146], [312, 236], u), active * (u < 0.85 ? 1 : (1 - u) / 0.15));
        });
        level = act / N; bound = k;
        R.root.style.setProperty("--glow", f1(0.1 + 0.6 * level));
      },
      metric: () => `${bound}/${N} receptors bound · signal ${pct(level)}`,
    };
  }

  function sceneEnzyme(d, L, anchored) {
    const xs = anchored ? [120, 210, 300] : [70, 152, 234, 316], N = xs.length, order = anchored ? [1, 0, 2] : [1, 3, 0, 2], x0 = xs[0];
    const up = isUp(d.target.action);
    const enz = L.enzyme || d.target.short || (anchored ? "receptor kinase" : "enzyme");
    const svg = `${sideLabels(anchored ? 14 : 30, 110)}<rect class="rx-cyto" x="-10" y="84" width="460" height="230"/>${anchored ? xs.map((x) => `<path class="rx-stalk" d="M${x - 10},44 L${x - 10},147"/>`).join("") : ""}${bilayer(66)}${nucleus(352, 270, 98, 46)}
${anchored ? xs.map((x) => `<ellipse class="rx-rec" cx="${x - 10}" cy="34" rx="8" ry="12"/>`).join("") + lab(xs[N - 1] + 6, 50, L.domain || "extracellular domain") : ""}
${xs.map((x, i) => g("enz", i, `<path class="rx-enz" d="M-8,-15 A17,17 0 1 0 8,-15 L0,-4 Z"/>`, "rx-enzg")).join("")}
${xs.map((_, i) => g("sub", i, `<rect class="rx-sub" x="-4" y="-4" width="8" height="8" rx="1.5"/>`)).join("")}
${xs.map((_, i) => g("phos", i, `<circle class="rx-sig" r="3.4"/><text class="rx-p" y="2.4" text-anchor="middle">P</text>`)).join("")}
${xs.map((_, i) => g("drug", i, drugGlyph(d.modality))).join("")}
${leader(x0, 180, x0, 196)}${lab(x0, 208, enz, "middle")}${L.note ? lab(x0, 221, L.note, "middle") : ""}${lab(x0 + 50, 126, L.pocket || "active site", "start")}${leader(x0 + 48, 128, x0 + 7, 146)}
${lab(anchored ? 170 : 230, anchored ? 240 : 246, L.signal || "downstream signal", "middle")}${lab(6, 128, L.substrate || "substrate", "start")}${leader(30, 132, x0 - 25, 154)}
${lab(434, 20, d.name, "end", "rx-strong")}${lab(434, 33, up ? (anchored ? "activates the kinase" : "activates the enzyme") : anchored ? "inhibits the kinase" : "inhibits the enzyme", "end")}`;
    let level = 0, bound = 0;
    return {
      svg,
      steps: [
        ["Enters the cell", `${d.name} crosses the membrane to reach ${enz} in the cytoplasm.`],
        [`Binds ${enz}`, up ? "It binds and switches the enzyme on." : "It occupies the enzyme's active site."],
        [up ? "Activity rises" : "Activity is blocked", up ? "The enzyme processes more substrate." : "The enzyme can no longer process its substrate."],
        ["Cell response", up ? "The downstream signal increases." : "The downstream signal falls."],
      ],
      frame(R, s) {
        const k = s.beat < 0 ? 0 : Math.round(s.occ * N);
        const set = new Set(order.slice(0, k));
        let act = 0;
        xs.forEach((x, i) => {
          mv(R.enz[i], [x, 160]);
          const isB = set.has(i);
          const start = anchored ? [x + 16, 14 + (i % 2) * 8] : [x - 14, 22 + (i % 2) * 10];
          let pos;
          const p0 = beatP(s, 0), p1 = beatP(s, 1);
          if (isB) pos = p1 > 0 ? mix([x - 4, 112], [x, 151], ease(p1)) : mix(start, [x - 4, 112], ease(p0));
          else pos = s.beat >= 1 ? [x + 22 + 8 * Math.sin(s.t * 0.8 + i), 112 + 8 * Math.cos(s.t + i)] : mix(start, [x + 22, 112], ease(p0));
          mv(R.drug[i], pos, s.beat < 0 ? 0 : (isB ? 1 : 0.55) * Math.min(1, p0 * 3 + (s.beat > 0 ? 1 : 0)));
          const active = up ? (isB ? p1 : 0.25) : 1 - (isB ? beatP(s, 2) * 0.9 + p1 * 0.1 : 0);
          act += active;
          mv(R.sub[i], [x - 22 + 3 * Math.sin(s.t * 1.2 + i), 160]);
          const u = ph(s.t, 2.6, i * 0.27);
          mv(R.phos[i], mix([x + 14, 168], [300, 240], u), active * (u < 0.85 ? 1 : (1 - u) / 0.15));
          R.enz[i].classList.toggle("rx-off", active < 0.5);
        });
        level = act / N; bound = k;
        R.root.style.setProperty("--glow", f1(0.1 + 0.6 * level));
      },
      metric: () => `${bound}/${N} ${anchored ? "kinases" : "enzymes"} bound · activity ${pct(level)}`,
    };
  }

  function sceneChannel(d, L, transporter) {
    const N = 3, xs = [90, 220, 350], order = [1, 0, 2], ions = transporter ? 4 : 6;
    const up = isUp(d.target.action);
    const name = L.channel || d.target.short || (transporter ? "transporter" : "ion channel");
    const body = transporter
      ? `<path class="rx-rec" data-half="l" d="M-1,90 L-14,94 C-18,110 -18,122 -14,138 L-1,140 Z"/><path class="rx-rec" data-half="r" d="M1,90 L14,94 C18,110 18,122 14,138 L1,140 Z"/>`
      : `<rect class="rx-rec" data-half="l" x="-15" y="90" width="10" height="48" rx="4"/><rect class="rx-rec" data-half="r" x="5" y="90" width="10" height="48" rx="4"/>`;
    const svg = `${sideLabels(30, 190)}<rect class="rx-cyto" x="-10" y="122" width="460" height="190"/>${bilayer(104)}
${xs.map((x, i) => g("ch", i, body)).join("")}
${xs.map((_, i) => Array.from({ length: ions }, (_, j) => `<g data-k="ion" data-i="${i * ions + j}"><circle class="rx-ion" r="3"/></g>`).join("")).join("")}
${xs.map((_, i) => g("drug", i, drugGlyph(d.modality))).join("")}
${leader(90, 142, 90, 158)}${lab(90, 170, name, "middle")}${lab(434, 20, d.name, "end", "rx-strong")}${lab(434, 33, up ? "opens / enhances" : transporter ? "inhibits transport" : "blocks the pore", "end")}${lab(434, 290, transporter ? "substrate" : "ions", "end")}`;
    let level = 0, bound = 0;
    return {
      svg,
      steps: [
        [`${d.name} arrives`, `It reaches ${name} in the membrane.`],
        [up ? "Binds and opens" : transporter ? "Binds the transporter" : "Plugs the channel", up ? "Binding makes the channel open more readily." : transporter ? "It binds the transporter and stops it cycling." : "It lodges in or over the pore."],
        [up ? "More flow" : "Less flow", up ? "More ions cross the membrane." : `Less ${transporter ? "substrate" : "ion"} crosses the membrane.`],
        ["Cell response", "The change in flow changes the cell's electrical or chemical state."],
      ],
      frame(R, s) {
        const k = s.beat < 0 ? 0 : Math.round(s.occ * N);
        const set = new Set(order.slice(0, k));
        let flow = 0;
        xs.forEach((x, i) => {
          const isB = set.has(i), b = isB ? beatP(s, 1) : 0, eff = isB ? beatP(s, 2) : 0;
          const widen = up ? 3 * b : 0, rock = transporter ? Math.sin(s.t * 2.4 + i) * (1 - (up ? 0 : b)) : 0;
          mv(R.ch[i], [x, 0]);
          R.ch[i].querySelectorAll("[data-half]").forEach((el) => {
            const sx = el.dataset.half === "l" ? -widen : widen;
            el.setAttribute("transform", transporter ? `rotate(${f1((el.dataset.half === "l" ? 1 : -1) * 5 * rock)} 0 115) translate(${sx} 0)` : `translate(${sx} 0)`);
          });
          const start = [x + 24, 20], dock = [x, up ? 84 : 100];
          const p0 = beatP(s, 0);
          mv(R.drug[i], isB ? mix(start, dock, ease(0.6 * p0 + 0.4 * b)) : [x + 26 + 8 * Math.sin(s.t + i), 44 + 6 * Math.cos(s.t * 0.8 + i)], s.beat < 0 ? 0 : (isB ? 1 : 0.5) * Math.min(1, p0 * 3 + (s.beat > 0 ? 1 : 0)));
          const open = up ? 1 + eff : 1 - eff;
          flow += up ? (isB ? 1 + eff : 1) / 2 : open;
          const period = transporter ? 3.2 : up ? 2.4 / (1 + eff) : 2.4;
          for (let j = 0; j < ions; j++) {
            const el = R.ion[i * ions + j];
            const u = ph(s.t, period, j / ions + i * 0.17);
            const yFree = lerp(16, 250, u), spread = clamp(Math.abs(yFree - 115) / 70);
            const free = [x + spread * 22 * Math.sin(j * 2.3 + i), yFree];
            const stuck = [x + (j % 2 ? 14 : -14) + 3 * Math.sin(s.t + j), 32 + 9 * j + 2 * Math.cos(s.t * 1.4 + j)];
            const blockedNow = !up && eff > 0.5;
            mv(el, blockedNow ? stuck : free, blockedNow ? 0.9 : u > 0.9 ? (1 - u) * 10 : u < 0.08 ? u * 12 : 1);
          }
        });
        level = flow / N; bound = k;
      },
      metric: () => `${bound}/${N} ${transporter ? "transporters" : "channels"} bound · flow ${pct(level)}`,
    };
  }

  function sceneNuclear(d, L) {
    const N = 3, rec = [[90, 138], [178, 150], [266, 134]], dna = [[160, 266], [240, 270], [320, 266]], order = [1, 0, 2];
    const up = isUp(d.target.action);
    const name = L.receptor || d.target.short || "nuclear receptor";
    const svg = `${sideLabels(26, 92)}<rect class="rx-cyto" x="-10" y="74" width="460" height="240"/>${bilayer(56)}
<g class="rx-nuc"><ellipse class="rx-nuc-glow" cx="250" cy="268" rx="178" ry="60"/><ellipse class="rx-nuc-env" cx="250" cy="268" rx="178" ry="60"/><ellipse class="rx-nuc-env rx-thin" cx="250" cy="268" rx="173" ry="55"/>${lab(96, 250, "nucleus")}</g>
<path class="rx-dna" d="M120,268 C140,258 150,278 170,268 S200,258 220,268 S250,278 270,268 S300,258 320,268 S350,278 380,268"/>${lab(386, 272, "DNA")}
${rec.map((_, i) => g("rec", i, `<path class="rx-enz" d="M-13,-2 C-13,-10 -4,-11 0,-6 C4,-11 13,-10 13,-2 C13,7 6,10 0,10 C-6,10 -13,7 -13,-2 Z"/>`)).join("")}
${rec.map((_, i) => g("nat", i, GLYPH.native)).join("")}
${rec.map((_, i) => g("drug", i, drugGlyph(d.modality))).join("")}
${rec.map((_, i) => g("rna", i, `<path class="rx-rna" d="M0,0 c4,-4 8,4 12,0 s8,4 12,0 s8,4 12,0"/>`)).join("")}
${leader(90, 152, 90, 172)}${lab(90, 184, name, "middle")}${lab(434, 20, d.name, "end", "rx-strong")}${lab(434, 33, up ? "switches gene expression on" : "blocks gene expression", "end")}`;
    let level = 0, bound = 0;
    return {
      svg,
      steps: [
        ["Enters the cell", `${d.name} crosses the membrane into the cytoplasm.`],
        [`Binds ${name}`, `It binds ${name} inside the cell.`],
        ["Moves into the nucleus", "The receptor complex moves into the nucleus and binds DNA."],
        [up ? "Genes switch on" : "Genes stay off", up ? "Target genes are transcribed into mRNA." : "The bound receptor cannot switch on its target genes."],
      ],
      frame(R, s) {
        const k = s.beat < 0 ? 0 : Math.round(s.occ * N);
        const set = new Set(order.slice(0, k));
        let act = 0;
        rec.forEach((r, i) => {
          const isB = set.has(i);
          const p0 = beatP(s, 0), p1 = beatP(s, 1), p2 = beatP(s, 2);
          const nativeOn = !up && !isB;
          const moves = isB ? p2 : nativeOn ? 1 : 0;
          const rp = mix(r, [dna[i][0], dna[i][1] - 12], ease(moves));
          mv(R.rec[i], rp);
          const start = [r[0] - 30, 16];
          mv(R.drug[i], isB ? (p1 > 0 ? mix([r[0] - 10, 100], [rp[0], rp[1] - 12], ease(p1)) : mix(start, [r[0] - 10, 100], ease(p0))) : [r[0] + 30 + 8 * Math.sin(s.t + i), 30 + 6 * Math.cos(s.t + i)], s.beat < 0 ? 0 : isB ? 1 : 0.5);
          mv(R.nat[i], [rp[0], rp[1] - 12], nativeOn ? 1 : 0);
          const active = up ? (isB ? beatP(s, 3) : 0) : nativeOn ? 1 : 0;
          act += active;
          const u = ph(s.t, 2.8, i * 0.3);
          mv(R.rna[i], mix([dna[i][0] - 18, dna[i][1] - 4], [dna[i][0] - 60, 150], u), active * (u > 0.85 ? (1 - u) / 0.15 : 1));
        });
        level = act / N; bound = k;
        R.root.style.setProperty("--glow", f1(0.1 + 0.55 * level));
      },
      metric: () => `${bound}/${N} receptors bound · transcription ${pct(level)}`,
    };
  }

  function sceneLigand(d, L) {
    const N = 4, xs = [80, 170, 260, 350], order = [0, 2, 1, 3];
    const name = L.ligand || d.target.short || "ligand";
    const svg = `${sideLabels(30, 236)}<rect class="rx-cyto" x="-10" y="200" width="460" height="110"/>${bilayer(182)}
${xs.map((x, i) => g("rec", i, `<path class="rx-stalk" d="M0,182 L0,146"/><path class="rx-rec" d="M-9,146 L-9,138 C-9,132 -5,132 -4,138 L-4,141 L4,141 L4,138 C5,132 9,132 9,138 L9,146 Z"/>`)).join("")}
${xs.map((_, i) => `<circle class="rx-pulse" data-k="pulse" data-i="${i}" r="0"/>`).join("")}
${xs.map((_, i) => g("lig", i, GLYPH.ligand)).join("")}
${xs.map((_, i) => g("drug", i, drugGlyph(d.modality))).join("")}
${lab(80, 128, L.receptor || "receptor", "middle")}${lab(434, 20, d.name, "end", "rx-strong")}${lab(434, 33, `captures ${name}`, "end")}${lab(6, 60, `free ${name}`, "start")}`;
    let level = 0, bound = 0;
    return {
      svg,
      steps: [
        [`${d.name} circulates`, `It travels in the fluid around cells, where ${name} is found.`],
        [`Captures ${name}`, `It binds ${name} before ${name} can reach its receptor.`],
        ["Receptors stay empty", `Fewer receptors are activated by ${name}.`],
        ["Cell response", "The signal that drives the response falls."],
      ],
      frame(R, s) {
        const k = s.beat < 0 ? 0 : Math.round(s.occ * N);
        const set = new Set(order.slice(0, k));
        let act = 0;
        xs.forEach((x, i) => {
          mv(R.rec[i], [x, 0]);
          const isB = set.has(i), c = isB ? beatP(s, 1) : 0;
          const drift = [x + 6 + 12 * Math.sin(s.t * 0.6 + i * 1.3), 62 + 10 * Math.cos(s.t * 0.7 + i)];
          const p0 = beatP(s, 0);
          mv(R.drug[i], isB ? mix(mix([x + 40, 10], [x + 10, 100], ease(p0)), drift, ease(c)) : [x + 34 + 6 * Math.sin(s.t + i), 44 + 6 * Math.cos(s.t + i)], s.beat < 0 ? 0 : isB ? 1 : 0.5 * p0);
          const dp = isB ? mix(mix([x + 40, 10], [x + 10, 100], ease(p0)), drift, ease(c)) : null;
          mv(R.lig[i], isB ? mix([x, 135], [dp[0], dp[1] - 12], ease(c)) : [x, 135]);
          const active = 1 - (isB ? beatP(s, 2) * 0.8 + c * 0.2 : 0);
          act += active;
          pulse(R.pulse[i], x, 222, s.t, i, active, 14);
        });
        level = act / N; bound = k;
      },
      metric: () => `${bound}/${N} ${name} captured · receptor signal ${pct(level)}`,
    };
  }

  function twoCells(topName, botName) {
    return `<rect class="rx-cyto rx-cyto-top" x="-10" y="-10" width="460" height="104"/><rect class="rx-cyto rx-cyto-bot" x="-10" y="226" width="460" height="90"/>
${bilayer(76)}${bilayer(208)}<rect class="rx-heat" x="-10" y="-10" width="460" height="86"/>${lab(6, 22, topName, "start", "rx-strong")}${lab(6, 290, botName, "start", "rx-strong")}`;
  }

  function sceneCheckpoint(d, L) {
    const N = 4, xs = [116, 200, 284, 368], order = [1, 3, 0, 2];
    const rName = L.receptor || d.target.short || "checkpoint receptor", lName = L.ligand || "ligand";
    const onLigand = /ligand/.test(lower(L.blocks));
    const svg = `${twoCells(L.effector || "T cell", L.target || "tumour cell")}<g class="rx-tumor-cell"><rect class="rx-hurt" x="-10" y="208" width="460" height="110"/></g>
${xs.map((x, i) => g("rec", i, `<path class="rx-stalk" d="M0,0 L0,30"/><rect class="rx-rec" x="-7" y="28" width="14" height="10" rx="4"/>`)).join("")}
${xs.map((x, i) => g("lig", i, `<path class="rx-stalk" d="M0,0 L0,-30"/><rect class="rx-rec rx-rec-alt" x="-7" y="-38" width="14" height="10" rx="4"/>`)).join("")}
${xs.map((_, i) => g("brake", i, `<path class="rx-brake" d="M-6,0 L6,0"/>`)).join("")}
${xs.map((_, i) => g("drug", i, drugGlyph(d.modality))).join("")}
${xs.map((_, i) => g("gran", i, `<circle class="rx-sig" r="3"/>`)).join("")}
${lab(6, 132, rName)}${lab(6, 168, lName)}${lab(434, 22, d.name, "end", "rx-strong")}${lab(434, 35, `blocks ${onLigand ? lName : rName}`, "end")}`;
    let level = 0, bound = 0;
    return {
      svg,
      steps: [
        ["The brake is on", `${lName} on the ${L.target || "target cell"} engages ${rName} and damps the ${L.effector || "T cell"} down.`],
        [`${d.name} binds ${onLigand ? lName : rName}`, `It blocks the ${rName}–${lName} contact.`],
        ["The brake is released", `The ${L.effector || "T cell"} becomes active again.`],
        ["Attack", `The active ${L.effector || "T cell"} kills the ${L.target || "target cell"}.`],
      ],
      frame(R, s) {
        const k = s.beat < 0 ? 0 : Math.round(s.occ * N);
        const set = new Set(order.slice(0, k));
        let freed = 0;
        xs.forEach((x, i) => {
          const isB = set.has(i), b = isB ? beatP(s, 1) : 0;
          const sep = 10 * ease(b);
